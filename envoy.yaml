# ──────────────────────────────────────────────────────────────────────────────
# Envoy — High-Performance Reverse Proxy
# Routes: WS (/ws) · gRPC (content-type: application/grpc) · XHTTP (/xhttp)
# Origin configured via environment variables:
#   ORIGIN_HOST  — Xray server IP / hostname  (required)
#   WS_PORT      — WebSocket inbound port      (default: 2052)
#   GRPC_PORT    — gRPC inbound port           (default: 2053)
#   XHTTP_PORT   — SplitHTTP inbound port      (default: 2054)
# ──────────────────────────────────────────────────────────────────────────────

static_resources:

  listeners:
    - name: listener_8080
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080

      # 1 MB upstream/downstream buffer — reduces small-packet round trips
      per_connection_buffer_limit_bytes: 1048576

      # Kernel-level TCP optimisations applied at accept() time
      socket_options:
        # TCP_NODELAY — disable Nagle, critical for low-latency tunnels
        - description: "TCP_NODELAY"
          level: 6       # IPPROTO_TCP
          name: 1        # TCP_NODELAY
          int_value: 1
          state: STATE_LISTENING
        # SO_KEEPALIVE — detect dead clients without waiting for full timeout
        - description: "SO_KEEPALIVE"
          level: 1       # SOL_SOCKET
          name: 9        # SO_KEEPALIVE
          int_value: 1
          state: STATE_LISTENING

      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http

                # AUTO: accept both HTTP/1.1 (WS/XHTTP) and HTTP/2 (gRPC) on the same port
                codec_type: AUTO

                # Disable idle timeout for long-lived WS / gRPC streams
                stream_idle_timeout: 0s
                request_timeout: 0s

                # Enable WebSocket upgrade at listener level
                upgrade_configs:
                  - upgrade_type: websocket

                # Disable access logging — eliminates per-request I/O overhead
                access_log: []

                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      # Do not append x-envoy-* headers — saves bytes per request
                      suppress_envoy_headers: true

                route_config:
                  name: main_route
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:

                        # ── 1. gRPC ──────────────────────────────────────────
                        # Must be first: match Content-Type before path checks
                        - match:
                            prefix: "/"
                            headers:
                              - name: "content-type"
                                string_match:
                                  prefix: "application/grpc"
                          route:
                            cluster: xray_grpc
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s

                        # ── 2. WebSocket (/ws) ────────────────────────────────
                        - match:
                            prefix: "/ws"
                          route:
                            cluster: xray_ws
                            timeout: 0s

                        # ── 3. XHTTP / SplitHTTP (/xhttp) ────────────────────
                        - match:
                            prefix: "/xhttp"
                          route:
                            cluster: xray_xhttp
                            timeout: 0s

  # ────────────────────────────────────────────────────────────────────────────
  # Clusters — static endpoints (no DNS per-request overhead)
  # ────────────────────────────────────────────────────────────────────────────
  clusters:

    # ── WS cluster ─────────────────────────────────────────────────────────
    - name: xray_ws
      connect_timeout: 3s
      type: STATIC
      per_connection_buffer_limit_bytes: 1048576

      upstream_connection_options:
        tcp_keepalive:
          keepalive_probes: 3
          keepalive_time: 30
          keepalive_interval: 5

      load_assignment:
        cluster_name: xray_ws
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: "${ORIGIN_HOST}"
                      port_value: ${WS_PORT}

      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options:
              enable_trailers: true

    # ── gRPC cluster (HTTP/2 upstream) ─────────────────────────────────────
    - name: xray_grpc
      connect_timeout: 3s
      type: STATIC
      per_connection_buffer_limit_bytes: 1048576

      upstream_connection_options:
        tcp_keepalive:
          keepalive_probes: 3
          keepalive_time: 30
          keepalive_interval: 5

      load_assignment:
        cluster_name: xray_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: "${ORIGIN_HOST}"
                      port_value: ${GRPC_PORT}

      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options:
              allow_connect: true
              # Large flow-control windows — maximise throughput for VPN traffic
              initial_stream_window_size: 268435456
              initial_connection_window_size: 268435456

    # ── XHTTP cluster ───────────────────────────────────────────────────────
    - name: xray_xhttp
      connect_timeout: 3s
      type: STATIC
      per_connection_buffer_limit_bytes: 1048576

      upstream_connection_options:
        tcp_keepalive:
          keepalive_probes: 3
          keepalive_time: 30
          keepalive_interval: 5

      load_assignment:
        cluster_name: xray_xhttp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: "${ORIGIN_HOST}"
                      port_value: ${XHTTP_PORT}

      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options:
              enable_trailers: true

# Admin API — localhost only, not exposed outside container
admin:
  access_log: []
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
